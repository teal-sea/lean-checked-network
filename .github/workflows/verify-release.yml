name: verify-release

on:
  pull_request:
    paths:
      - 'transformer/**'
      - 'acas/**'
      - 'VERIFY.md'
      - '.github/workflows/verify-release.yml'
  release:
    types: [published]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    name: Published evidence reader and rejection controls
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Exact reader block in fresh Ubuntu, anonymous downloads and all controls
        shell: bash
        run: |
          set -euo pipefail
          free -h
          df -h /
          python3 transformer/release-gate-input.py | docker run --rm -i ubuntu:24.04 bash
