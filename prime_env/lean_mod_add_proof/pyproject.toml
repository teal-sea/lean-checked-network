[project]
name = "lean-mod-add-proof"
version = "0.1.0"
description = "Prove in Lean 4 that a frozen integer network adds mod p; the Lean kernel is the reward."
requires-python = ">=3.11"
dependencies = ["verifiers>=0.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lean_mod_add_proof"]
# The task data (Network.lean, tasks/*/Weights.lean, tasks.jsonl) ships inside the package.
