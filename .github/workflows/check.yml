name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Weights match, circle proof (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Lean weight files equal network/*.npz; every answer right
        run: python3 verify_weights.py
      - name: Circle proof and its soundness checks
        run: python3 mechanism.py network/trained.npz

  lean:
    name: Lean kernel check, replay, planted fault, axioms
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - name: Install elan (the Lean version comes from lean/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build both networks, replay every module, planted fault, axioms
        run: ./run_lean.sh
