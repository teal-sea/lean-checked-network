            --archive "$RUNNER_TEMP/input-coverage/12096712360.zip" \
            --artifact-metadata "$RUNNER_TEMP/input-coverage/12096712360.json" \
            --row0-archive "$RUNNER_TEMP/input-coverage/12098570663.zip" \
            --row0-metadata "$RUNNER_TEMP/input-coverage/12098570663.json" 2>&1 | tee input.ci.out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transformer-input-row${{ matrix.row }}-${{ github.run_id }}
          retention-days: 7
          include-hidden-files: true
          path: |
            transformer/mathlib/input-out/
            transformer/mathlib/input.ci.out
            transformer/mathlib/input_*.py
            transformer/mathlib/test_input*.py
            transformer/mathlib/input_policy.json
            transformer/mathlib/row0_checkpoint.json
            transformer/mathlib/TransformerCore/Net/InputRows/
            transformer/mathlib/TransformerBridge/InputRows/
            transformer/mathlib/TransformerBridge/InputAll*.lean
            transformer/mathlib/.lake/build/lib/lean/TransformerCore/Net/InputRows/
            transformer/mathlib/.lake/build/lib/lean/TransformerBridge/InputRows/
            transformer/mathlib/.lake/build/lib/lean/TransformerBridge/InputAll*.olean
          if-no-files-found: error

  input-all:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.core_mode == 'mathlib-input-all' && github.event.repository.private == false && github.repository == 'teal-sea/lean-checked-network' && github.ref == 'refs/heads/vizier/finish-transformer' }}
    name: Final universal input integer margin and fused real-softmax assembly
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: "2"
      INPUT_PUBLIC_STANDARD: "1"
      INPUT_LOCK: ${{ inputs.input_artifact_lock }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Tiny source and preservation controls (no Lean evidence)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/input-coverage"
          export TMPDIR="$RUNNER_TEMP/input-coverage"
          python3 -B -W error transformer/mathlib/test_input_coverage.py
          python3 -B -W error transformer/mathlib/test_input_harness.py
          python3 -B -W error transformer/mathlib/test_row0_finalize.py
          python3 -B -W error transformer/mathlib/test_rawpacked.py
      - name: Download two exact public accepted artifacts (no blind extraction)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in 12096712360 12098570663; do
            gh api "repos/teal-sea/lean-checked-network/actions/artifacts/$artifact" > "$RUNNER_TEMP/input-coverage/$artifact.json"
            curl --fail --location --retry 2 --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/teal-sea/lean-checked-network/actions/artifacts/$artifact/zip" \
              -o "$RUNNER_TEMP/input-coverage/$artifact.zip"
          done
      - name: Download the explicit parent-adjudicated lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -c 'import os,pathlib; pathlib.Path("input-lock.json").write_text(os.environ["INPUT_LOCK"])'
          python3 -B -W error transformer/mathlib/input_artifacts.py --lock input-lock.json --dest "$RUNNER_TEMP/accepted-input-rows" --out "$RUNNER_TEMP/local-input-lock.json" --all
      - name: Install stable compiler
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/input-coverage/elan-init.sh"
          sh "$RUNNER_TEMP/input-coverage/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib dependencies (one serial Lake process)
        timeout-minutes: 9
        run: cd transformer/mathlib && timeout -s TERM -k 20 480 lake exe cache get
      - name: Full retained grid validation and universal final assembly
        timeout-minutes: 46
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP/input-coverage"
          cd transformer/mathlib
          timeout -s TERM -k 20 2700 python3 -B -W error input_runner.py --all --rows-lock "$RUNNER_TEMP/local-input-lock.json" \
            --archive "$RUNNER_TEMP/input-coverage/12096712360.zip" \
            --artifact-metadata "$RUNNER_TEMP/input-coverage/12096712360.json" \
            --row0-archive "$RUNNER_TEMP/input-coverage/12098570663.zip" \
            --row0-metadata "$RUNNER_TEMP/input-coverage/12098570663.json" 2>&1 | tee input.ci.out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transformer-input-all-${{ github.run_id }}
          retention-days: 7
          include-hidden-files: true
          path: |
            transformer/mathlib/input-out/
            transformer/mathlib/input.ci.out
            transformer/mathlib/input_*.py
            transformer/mathlib/test_input*.py
            transformer/mathlib/input_policy.json
            transformer/mathlib/row0_checkpoint.json
            transformer/mathlib/TransformerCore/Net/InputRows/
            transformer/mathlib/TransformerBridge/InputRows/
            transformer/mathlib/TransformerBridge/InputAll*.lean
            transformer/mathlib/.lake/build/lib/lean/TransformerCore/Net/InputRows/
            transformer/mathlib/.lake/build/lib/lean/TransformerBridge/InputRows/
            transformer/mathlib/.lake/build/lib/lean/TransformerBridge/InputAll*.olean
          if-no-files-found: error
