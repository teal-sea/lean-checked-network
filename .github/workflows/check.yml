name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Weights match, circle proof (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Lean weight files equal network/*.npz; every answer right
        run: python3 verify_weights.py
      - name: Circle proof and its soundness checks
        run: python3 mechanism.py network/trained.npz

  lean:
    name: Lean kernel check, replay, planted fault, axioms
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - name: Install elan (the Lean version comes from lean/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Recurrent adder (rnn/), every input length, kernel check and replay, about 10 s
        run: ./rnn/run_check.sh
      - name: Sweep runner on a tiny network, right everywhere, then a wrong one, then the negative control, about 2 min
        run: |
          python3 sweep/run_one.py 7 8 0 1.0 1.0 3000 /tmp/sweep-right --repo .
          python3 sweep/run_one.py 7 8 0 0.7 1.0 200 /tmp/sweep-wrong --repo .
          python3 sweep/negative_control.py /tmp/sweep-wrong Trained
      - name: Prime Intellect environment grader, the fast tests (brute force passes; sorry, native_decide, skipKernelTC, wrong statement, wrong network, and the three reward hacks found in review score 0)
        run: |
          cd prime_env/tests && ./run_all_tests.sh
          grep -q '"reward": 1.0' logs/i_bruteforce_p7.txt
          for t in ii_sorry_p7 ii_b_sorry_noguard_p7 iii_native_decide_p7 iii_b_native_noguard_p7 iii_c_decide_native_noguard_p7 iv_skipKernelTC_guard_p7 iv_b_skipKernelTC_noguard_p7 v_wrong_statement_p7 v_b_renamed_p7 vi_wrong_network_p7 ix_a_fake_spec_noimport_p7 ix_a_b_fake_spec_noguard_p7 ix_b_eval_io_p7 ix_b_b_eval_io_noguard_p7 ix_c_namespace_shadow_p7; do grep -q '"reward": 0.0' logs/$t.txt || { echo "test $t did not score 0.0"; exit 1; }; done
      - name: Build both networks, replay every module, planted fault, axioms
        run: ./run_lean.sh

  phasegrid:
    name: Every-modulus theorem (Mathlib, from cache), the p = 7 instance, the last-pair faults
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install elan (toolchains come from the two lean-toolchain files)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check the p = 7 phase-grid network, replay it, reject the planted fault (core Lean, seconds)
        run: |
          cd phasegrid/instances
          ./check_instance.sh P7Full 7 1
          ./check_fault.sh
      - name: The last-pair faults at p = 7 and at p = 113 (448 neurons), rejected by the kernel and through addDecl, about 6 min
        run: |
          cd phasegrid/instances
          ./check_last_fault.sh
      - name: Build the Mathlib project from the cache, replay every module, print axioms, scan sources
        run: |
          cd phasegrid/mathlib
          lake exe cache get
          ./verify2.sh
